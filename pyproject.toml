[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netprobe"
dynamic = ["version"]
description = "Find where your network is slow, and when: per-segment latency, loss and bufferbloat, idle and under load."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/astelmach20/netprobe"

[project.scripts]
netprobe = "netprobe:main"

[tool.setuptools]
py-modules = ["netprobe"]

[tool.setuptools.dynamic]
version = { attr = "netprobe.__version__" }
